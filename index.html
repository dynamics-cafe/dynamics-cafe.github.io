<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dynamics Cafe ☕</title>

  <meta
    name="description"
    content="Dynamics Cafe — online seminars on dynamical systems and their applications."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="container">
    <nav>

      <a class="logo" href="/">
        <img src="logo.png" alt="" class="nav-logo">
        <span>Dynamics Cafe ☕</span>
      </a>

      <div class="links">
        <a
          href="https://www.linkedin.com/company/dynamics-cafe/"
          target="_blank"
          rel="noopener noreferrer"
        >
          LinkedIn
        </a>
      </div>

    </nav>
  </div>
</header>


<main>

  <section class="hero">

    <!--
      Use the trajectory-background SVG block
      already present in index2.html here, unchanged.
    -->

    <div class="trajectory-background" aria-hidden="true">

  <svg
    class="phase-portrait"
    viewBox="0 0 1200 650"
    preserveAspectRatio="xMidYMid slice"
  >

    <defs>

  <!-- Espresso → roasted brown → coffee orange -->
  <linearGradient
    id="coffee-gradient"
    x1="0%"
    y1="0%"
    x2="100%"
    y2="100%"
  >
    <stop offset="0%" stop-color="#471904" />
    <stop offset="48%" stop-color="#592106" />
    <stop offset="100%" stop-color="#D57D2E" />
  </linearGradient>


  <!-- Dark roast → copper → caramel -->
  <linearGradient
    id="copper-gradient"
    x1="0%"
    y1="100%"
    x2="100%"
    y2="0%"
  >
    <stop offset="0%" stop-color="#592106" />
    <stop offset="52%" stop-color="#D57D2E" />
    <stop offset="100%" stop-color="#E1A462" />
  </linearGradient>


  <!-- Coffee brown → copper → latte caramel -->
  <linearGradient
    id="caramel-gradient"
    x1="0%"
    y1="0%"
    x2="100%"
    y2="100%"
  >
    <stop offset="0%" stop-color="#7F5934" />
    <stop offset="52%" stop-color="#D57D2E" />
    <stop offset="100%" stop-color="#E1A462" />
  </linearGradient>

</defs>


<!-- Coffee family -->

<g class="trajectory-family coffee-family">

  <path
    class="trajectory-base"
    stroke="url(#coffee-gradient)"
    d="M-100 500
       C100 80 300 120 410 320
       C500 485 650 510 790 315
       C910 145 1050 120 1300 335"
  />

  <path
    class="trajectory-flow flow-fast"
    stroke="#D57D2E"
    d="M-100 500
       C100 80 300 120 410 320
       C500 485 650 510 790 315
       C910 145 1050 120 1300 335"
  />

</g>


<!-- Copper family -->

<g class="trajectory-family copper-family">

  <path
    class="trajectory-base"
    stroke="url(#copper-gradient)"
    d="M-120 190
       C130 560 320 70 540 280
       C690 425 760 510 930 285
       C1070 100 1160 220 1320 440"
  />

  <path
    class="trajectory-flow flow-medium"
    stroke="#E1A462"
    d="M-120 190
       C130 560 320 70 540 280
       C690 425 760 510 930 285
       C1070 100 1160 220 1320 440"
  />

</g>


<!-- Caramel family -->

<g class="trajectory-family caramel-family">

  <path
    class="trajectory-base"
    stroke="url(#caramel-gradient)"
    d="M-120 390
       C90 330 215 85 420 175
       C610 260 580 535 805 430
       C1010 335 1080 75 1320 160"
  />

  <path
    class="trajectory-flow flow-slow"
    stroke="#7F5934"
    d="M-120 390
       C90 330 215 85 420 175
       C610 260 580 535 805 430
       C1010 335 1080 75 1320 160"
  />

</g>


    <!-- Coffee family -->
    <g class="trajectory-family coffee-family">
    
      <path
        class="trajectory-base"
        stroke="url(#coffee-gradient)"
        d="M-100 500
           C100 80 300 120 410 320
           C500 485 650 510 790 315
           C910 145 1050 120 1300 335"
      />

      <path
        class="trajectory-flow flow-fast"
        stroke="#FF9B21"
        d="M-100 500
           C100 80 300 120 410 320
           C500 485 650 510 790 315
           C910 145 1050 120 1300 335"
      />

    </g>


    <!-- Copper family -->
    <g class="trajectory-family copper-family">
    
      <path
        class="trajectory-base"
        stroke="url(#copper-gradient)"
        d="M-120 190
           C130 560 320 70 540 280
           C690 425 760 510 930 285
           C1070 100 1160 220 1320 440"
      />

      <path
        class="trajectory-flow flow-medium"
        stroke="#E66C08"
        d="M-120 190
           C130 560 320 70 540 280
           C690 425 760 510 930 285
           C1070 100 1160 220 1320 440"
      />

    </g>


    <!-- Caramel family -->
  <g class="trajectory-family caramel-family">
  
    <path
      class="trajectory-base"
      stroke="url(#caramel-gradient)"
        d="M-120 390
           C90 330 215 85 420 175
           C610 260 580 535 805 430
           C1010 335 1080 75 1320 160"
      />

      <path
        class="trajectory-flow flow-slow"
        stroke="#FFC066"
        d="M-120 390
           C90 330 215 85 420 175
           C610 260 580 535 805 430
           C1010 335 1080 75 1320 160"
      />

    </g>


    <!-- Quieter secondary trajectories -->

    <path
      class="secondary-trajectory"
      d="M-80 570
         C190 220 350 240 505 390
         C670 545 880 395 1010 220
         C1110 85 1240 120 1320 200"
    />

    <path
      class="secondary-trajectory secondary-two"
      d="M-100 110
         C130 360 330 450 520 220
         C680 25 855 95 965 335
         C1040 500 1190 490 1320 360"
    />

  </svg>

</div>



    <div class="container hero-content">

      <h1>
        Dynamics<br>
        Cafe ☕
      </h1>

      <p class="tagline">
        Online seminars on dynamical systems and their applications.
      </p>

      <div id="next-seminar" class="event">

        <p class="muted">
          Loading next seminar…
        </p>

      </div>

    </div>

  </section>

</main>


<footer>
  <div class="container footer-content">

    <p>
      <strong>Dynamics Cafe ☕</strong>
    </p>

    <p>
      <a
        href="https://www.linkedin.com/company/dynamics-cafe/"
        target="_blank"
        rel="noopener noreferrer"
      >
        LinkedIn
      </a>
    </p>

  </div>
</footer>


<script src="js/seminars.js"></script>

</body>
</html>
