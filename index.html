<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dynamics Cafe ☕</title>

  <meta
    name="description"
    content="Dynamics Cafe — online seminars on dynamical systems and their applications."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="container">
    <nav>

      <a class="logo" href="/">
        <img src="logo.png" alt="" class="nav-logo">
        <span>Dynamics Cafe ☕</span>
      </a>

      <div class="links">
        <a
          href="https://www.linkedin.com/company/dynamics-cafe/"
          target="_blank"
          rel="noopener noreferrer"
        >
          LinkedIn
        </a>
      </div>

    </nav>
  </div>
</header>


<main>

  <section class="hero">

    <!--
      Use the trajectory-background SVG block
      already present in index2.html here, unchanged.
    -->

    <div class="trajectory-background" aria-hidden="true">

  <svg
    class="phase-portrait"
    viewBox="0 0 1200 650"
    preserveAspectRatio="xMidYMid slice"
  >

    <defs>

  <!-- Dark coffee → copper → orange -->
  <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#4A1500" />
    <stop offset="45%" stop-color="#8A3707" />
    <stop offset="100%" stop-color="#D66A0A" />
  </linearGradient>

  <!-- Burnt orange → coffee → caramel -->
  <linearGradient id="violet-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7A2900" />
    <stop offset="48%" stop-color="#C45408" />
    <stop offset="100%" stop-color="#F09A32" />
  </linearGradient>

  <!-- Deep espresso → orange → golden cream -->
  <linearGradient id="coral-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#351000" />
    <stop offset="50%" stop-color="#A74305" />
    <stop offset="100%" stop-color="#E9A34E" />
  </linearGradient>

</defs>


    <!-- first family -->

    <g class="trajectory-family cyan-family">

      <path
        class="trajectory-base"
        stroke="#FF9B21"
        d="M-100 500
           C100 80 300 120 410 320
           C500 485 650 510 790 315
           C910 145 1050 120 1300 335"
      />

      <path
        class="trajectory-flow flow-fast"
        stroke="#FF9B21"
        d="M-100 500
           C100 80 300 120 410 320
           C500 485 650 510 790 315
           C910 145 1050 120 1300 335"
      />

    </g>


    <!-- Plum family -->

    <g class="trajectory-family violet-family">

      <path
        class="trajectory-base"
        stroke="#E66C08"
        d="M-120 190
           C130 560 320 70 540 280
           C690 425 760 510 930 285
           C1070 100 1160 220 1320 440"
      />

      <path
        class="trajectory-flow flow-medium"
        stroke="#E66C08"
        d="M-120 190
           C130 560 320 70 540 280
           C690 425 760 510 930 285
           C1070 100 1160 220 1320 440"
      />

    </g>


    <!-- Terracotta family -->

    <g class="trajectory-family coral-family">

      <path
        class="trajectory-base"
        stroke="#FFC066"
        d="M-120 390
           C90 330 215 85 420 175
           C610 260 580 535 805 430
           C1010 335 1080 75 1320 160"
      />

      <path
        class="trajectory-flow flow-slow"
        stroke="#FFC066"
        d="M-120 390
           C90 330 215 85 420 175
           C610 260 580 535 805 430
           C1010 335 1080 75 1320 160"
      />

    </g>


    <!-- Quieter secondary trajectories -->

    <path
      class="secondary-trajectory"
      d="M-80 570
         C190 220 350 240 505 390
         C670 545 880 395 1010 220
         C1110 85 1240 120 1320 200"
    />

    <path
      class="secondary-trajectory secondary-two"
      d="M-100 110
         C130 360 330 450 520 220
         C680 25 855 95 965 335
         C1040 500 1190 490 1320 360"
    />

  </svg>

</div>



    <div class="container hero-content">

      <h1>
        Dynamics<br>
        Cafe ☕
      </h1>

      <p class="tagline">
        Online seminars on dynamical systems and their applications.
      </p>

      <div id="next-seminar" class="event">

        <p class="muted">
          Loading next seminar…
        </p>

      </div>

    </div>

  </section>

</main>


<footer>
  <div class="container footer-content">

    <p>
      <strong>Dynamics Cafe ☕</strong>
    </p>

    <p>
      <a
        href="https://www.linkedin.com/company/dynamics-cafe/"
        target="_blank"
        rel="noopener noreferrer"
      >
        LinkedIn
      </a>
    </p>

  </div>
</footer>


<script src="js/seminars.js"></script>

</body>
</html>
