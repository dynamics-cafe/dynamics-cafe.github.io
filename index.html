<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dynamics Cafe ☕</title>

  <meta
    name="description"
    content="Dynamics Cafe — online seminars on dynamical systems and their applications."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="container">
    <nav>

      <a class="logo" href="/">
        <img src="logo.png" alt="" class="nav-logo">
        <span>Dynamics Cafe<small>Seminar Group</small></span>
      </a>

      <div class="links">
        <a
          href="https://www.linkedin.com/company/dynamics-cafe/"
          target="_blank"
          rel="noopener noreferrer"
        >
          LinkedIn
        </a>
      </div>

    </nav>
  </div>
</header>


<main>

  <section class="hero">

    <canvas id="flow" class="trajectory-background" aria-hidden="true"></canvas>

    <div class="container hero-content">

      <h1>
        Dynamics<br>
        Cafe ☕
      </h1>

      <p class="tagline">
        Online seminars on dynamical systems and their applications.
      </p>

      <div id="next-seminar" class="event">

        <p class="muted">
          Loading next seminar…
        </p>

      </div>

    </div>

  </section>

</main>


<footer>
  <div class="container footer-content">

    <p>
      <strong>Dynamics Cafe ☕</strong>
    </p>

    <p>
      <a
        href="https://www.linkedin.com/company/dynamics-cafe/"
        target="_blank"
        rel="noopener noreferrer"
      >
        LinkedIn
      </a>
    </p>

  </div>
</footer>


<script src="js/flow.js"></script>
<script src="js/seminars.js"></script>

</body>
</html>
